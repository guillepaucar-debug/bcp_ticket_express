<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BCP Ticket Express · Tótem</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <header>Tótem de bienvenida</header>
  <main class="hidden">
    <div class="card">
      <h2>Acerca tu código QR a la cámara</h2>
      <div id="reader"></div>
    </div>
    <div id="msg" class="card hidden" role="status" aria-live="polite"></div>
    <details class="card">
      <summary>Prueba manual (sin cámara)</summary>
      <label for="manual">Texto del QR</label>
      <input id="manual" placeholder="bcp://ticket?id=T001&agencia=0101&hash=...">
      <button id="enviar" type="button">Validar</button>
    </details>
  </main>
  <script>
    const msg = document.getElementById('msg');
    const apiBaseUrl = (window.BCP_CONFIG?.apiBaseUrl || '').replace(/\/+$/, '');
    const api = `${apiBaseUrl}/api/v1`;
    let ocupado = false;

    async function readJson(response) {
      const contentType = response.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        await response.text();
        throw new Error(`La API devolvió una respuesta inesperada (HTTP ${response.status}). Revisa la URL del backend en config.js.`);
      }
      return response.json();
    }

    async function validar(payload) {
      if (ocupado) return;
      ocupado = true;

      try {
        const response = await fetch(`${api}/tickets/validate`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload }),
        });
        const result = await readJson(response);
        msg.replaceChildren();
        const title = document.createElement('h2');
        const detail = document.createElement('p');
        title.textContent = response.ok ? 'Bienvenido' : 'No pudimos validar tu turno';
        title.style.color = response.ok ? 'var(--ok)' : 'var(--rojo)';
        detail.textContent = response.ok
          ? `Turno ${result.id} registrado en sala. Turnos antes que tú: ${result.turnosPrevios}.`
          : result.error || 'Error de validación';
        msg.append(title, detail);
        msg.classList.remove('hidden');
      } catch (error) {
        msg.textContent = error.message || 'No se pudo conectar con el servidor.';
        msg.classList.remove('hidden');
      } finally {
        window.setTimeout(() => {
          ocupado = false;
          msg.classList.add('hidden');
        }, 4000);
      }
    }

    async function startTotem() {
      try {
        const response = await fetch(`${api}/auth/me?role=admin`, { credentials: 'include' });
        if (response.status === 401 || response.status === 403) {
          window.location.replace('/login.html?role=admin');
          return;
        }
        if (!response.ok) throw new Error('No se pudo verificar la sesión de administrador.');

        document.querySelector('main').classList.remove('hidden');
        if (!window.Html5Qrcode) throw new Error('No se pudo cargar el lector QR.');
        await new Html5Qrcode('reader')
          .start({ facingMode: 'environment' }, { fps: 10, qrbox: 240 }, validar);
      } catch (error) {
        document.querySelector('main').classList.remove('hidden');
        document.getElementById('reader').textContent =
          `${error.message || 'No se pudo abrir la cámara.'} Puedes validar pegando el QR si tienes acceso de administrador.`;
      }
    }

    document.getElementById('enviar').addEventListener('click', () => {
      validar(document.getElementById('manual').value.trim());
    });
    startTotem();
  </script>
</body>
</html>
